name: OpenWrt-ImmortalWrt-x86_64 编译

on:
  schedule:
    - cron: 0 21 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译（无视变更检测）
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 清空缓存
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 4
  CACHE_KEY_VER: x86-v1
  TZ: Asia/Shanghai
  TAG_NAME: build-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 拉取仓库配置文件
        uses: actions/checkout@v6

      - name: 安装OpenWrt编译完整依赖
        run: |
          sudo apt update
          sudo apt install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          
      - name: 清理本地缓存
        if: github.event.inputs.clean_cache == 'true'
        run: |
          rm -rf openwrt .ccache build.log upstream_commit.txt last_commit.txt pkg_ref.txt || true
          echo "✅ 缓存清理完成"

      - name: 恢复编译缓存 dl + ccache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            .ccache
          key: x86-64-${{ env.CACHE_KEY_VER }}
          restore-keys: |
            x86-64-${{ env.CACHE_KEY_VER }}

      - name: 校验源码目录
        run: |
          if [ -d openwrt ]; then
            cd openwrt
            REMOTE_URL=$(git remote get-url origin)
            CURRENT_BRANCH=$(git symbolic-ref --short HEAD)
            if [[ "${REMOTE_URL}" != "${{ env.REPO_URL }}" || "${CURRENT_BRANCH}" != "${{ env.REPO_BRANCH }}" ]]; then
              echo "⚠️ 目录分支不匹配，重建源码"
              cd ..
              rm -rf openwrt
            fi
          fi

      # ===== 修改点1：改为完整克隆（解决 default-settings git describe 失败） =====
      - name: 克隆/更新源码
        run: |
          if [ ! -d openwrt ]; then
            git clone -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          else
            cd openwrt
            git fetch origin --prune --tags
            git reset --hard origin/${{ env.REPO_BRANCH }}
            git clean -df
          fi
          cd openwrt
          git rev-parse HEAD > ../upstream_commit.txt

      - name: 执行 diy-part1.sh
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          cd openwrt
          ../${{ env.DIY_P1_SH }}

      - name: 导入配置 + 执行 diy-part2.sh
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          cd openwrt
          ../${{ env.DIY_P2_SH }}
          make defconfig

      - name: 导出配置用于变更对比
        run: |
          cd openwrt
          grep -E '^(CONFIG_PACKAGE_|CONFIG_LUCI_)' .config | sort > ../current_pkg.txt

      - name: 判断是否启动编译
        id: judge_build
        run: |
          NEED_BUILD=0
          FORCE=${{ github.event.inputs.force_build }}
          if [[ "$FORCE" == "true" ]]; then
            echo "⚠️ 手动强制编译开启"
            NEED_BUILD=1
          fi

          if [ -f last_commit.txt ] && [ -f upstream_commit.txt ]; then
            if ! diff -q last_commit.txt upstream_commit.txt >/dev/null; then
              echo "⚠️ 上游源码更新，触发编译"
              NEED_BUILD=1
            fi
          fi

          if [ $NEED_BUILD -eq 0 ]; then
            if [ ! -f pkg_ref.txt ]; then
              echo "ℹ️ 首次构建，执行编译"
              NEED_BUILD=1
            elif ! diff -q pkg_ref.txt current_pkg.txt >/dev/null; then
              echo "⚠️ 固件配置发生变化，开始编译"
              NEED_BUILD=1
            else
              echo "✅ 源码与配置无变更，跳过编译"
            fi
          fi

          echo "NEED_BUILD=${NEED_BUILD}" >> $GITHUB_ENV

      - name: 预下载源码包
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          make defconfig
          find dl -size -1024c -exec rm -f {} \;
          make download -j$(nproc) || make download -j1 V=s
          echo "✅ 源码包下载完成"

      - name: 编译固件
        id: compile_firm
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          THREAD=${{ env.COMPILE_THREAD }}
          LOG=${{ github.workspace }}/build.log
          set -o pipefail
          RESULT="fail"
          if nice -n 10 make -j${THREAD} 2>&1 | tee ${LOG}; then
            RESULT="ok"
          else
            echo "❌ 多线程编译失败，切换单线程重试"
            cat ${LOG}
            if nice -n 10 make -j1 V=s 2>&1 | tee ${LOG}; then
              RESULT="ok"
            else
              echo "❌ 编译最终失败"
              exit 1
            fi
          fi
          BOARD=$(grep CONFIG_TARGET_BOARD .config | cut -d'=' -f2 | tr -d '"')
          SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | cut -d'=' -f2 | tr -d '"')
          echo "result=${RESULT}" >> $GITHUB_OUTPUT
          echo "BOARD=${BOARD}" >> $GITHUB_OUTPUT
          echo "SUBTARGET=${SUBTARGET}" >> $GITHUB_OUTPUT

      - name: 更新缓存快照
        if: steps.compile_firm.outputs.result == 'ok'
        run: |
          cp upstream_commit.txt last_commit.txt
          cp current_pkg.txt pkg_ref.txt
          echo "✅ 缓存快照已更新"

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        if: env.NEED_BUILD == '1'
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传固件文件（Artifact）
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ steps.compile_firm.outputs.BOARD }}-${{ steps.compile_firm.outputs.SUBTARGET }}
          path: |
            openwrt/bin/targets/${{ steps.compile_firm.outputs.BOARD }}/${{ steps.compile_firm.outputs.SUBTARGET }}/*.bin
            openwrt/bin/targets/${{ steps.compile_firm.outputs.BOARD }}/${{ steps.compile_firm.outputs.SUBTARGET }}/*.manifest
          retention-days: 14

      - name: Create & Push Git Tag
        if: steps.compile_firm.outputs.result == 'ok'
        run: |
          git config --global user.name "CI Builder"
          git config --global user.email "builder@actions.local"
          git tag -f ${{ env.TAG_NAME }}
          git push -f origin ${{ env.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建Release发布
        if: steps.compile_firm.outputs.result == 'ok'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ImmortalWrt x86_64 自动构建 ${{ github.run_number }}
          files: |
            openwrt/bin/targets/${{ steps.compile_firm.outputs.BOARD }}/${{ steps.compile_firm.outputs.SUBTARGET }}/*
          generate_release_notes: true
          overwrite: true

      - name: Retain latest 5 releases, remove older releases & tags
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const reserveCount = 5;
            console.log(`设置保留最新 ${reserveCount} 个正式Release`);

            const { data: releases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });

            const validReleases = releases
              .filter(item => !item.draft)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            console.log(`当前正式Release总数：${validReleases.length}`);
            const removeList = validReleases.slice(reserveCount);
            console.log(`待删除数量：${removeList.length}`);

            for (const release of removeList) {
              console.log(`开始删除 Release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner, repo, release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`
                });
                console.log(`标签 ${release.tag_name} 删除成功`);
              } catch (err) {
                console.log(`标签 ${release.tag_name} 删除警告：`, err.message);
              }
            }




name: OpenWrt-immortalwrt版

on:
  schedule:
    - cron: 0 22 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CONFIG_CACHE_REF: pkg_ref.txt
  UPSTREAM_COMMIT_FILE: upstream_commit.txt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: false
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable chromedriver google-cloud-sdk firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* gfortran* imagemagick* *-jdk mongodb-* mono-* monodoc-* unixodbc-dev ant* perl libgl1-mesa-dri apache2* imagemagick* nginx phantomjs php* libpq-dev r-base* ruby* sphinxsearch"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle* /usr/local/bin/azcopy /usr/share/kotlinc /usr/share/apache-maven-* /usr/local/share/gecko_driver /usr/share/lintian"

    - name: Checkout 拉取自定义文件
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  

    - name: 挂载4G Swap 缓解内存溢出
      run: |
        cd "$GITHUB_WORKSPACE"
        sudo dd if=/dev/zero of=swapfile bs=1M count=4096 status=none
        sudo chmod 600 swapfile
        sudo mkswap swapfile
        sudo swapon swapfile
        echo 10 | sudo tee /proc/sys/vm/swappiness
        free -h

    - name: 恢复编译缓存
      uses: actions/cache@v6
      with:
        path: |
          openwrt/dl
          openwrt/build_dir
          openwrt/staging_dir
          .ccache
          ${{ env.CONFIG_CACHE_REF }}
          ${{ env.UPSTREAM_COMMIT_FILE }}
          old_commit.txt
        key: mt798x-6.6-build-${{ github.sha }}
        restore-keys: mt798x-6.6-build-

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq full-upgrade
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
        libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
        ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
        python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo ln -sf /usr/share/zoneinfo/"$TZ" /etc/localtime
        echo "$TZ" | sudo tee /etc/timezone > /dev/null
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Enable CCache
      run: |
        echo "export CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
        echo "export CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

    - name: Clone / Update source code
      run: |
        if [ -d "openwrt" ]; then
          if [ ! -d "openwrt/.git" ]; then
            rm -rf openwrt
          fi
        fi
        if [ -d openwrt/.git ];then
          cd openwrt
          git fetch origin $REPO_BRANCH
          git reset --hard origin/$REPO_BRANCH
        else
          git clone $REPO_URL -b $REPO_BRANCH openwrt
        fi
        cd openwrt
        git rev-parse HEAD > ../${{ env.UPSTREAM_COMMIT_FILE }}

    - name: 执行diy‑part1.sh
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Load custom configuration & 执行diy‑part2.sh
      run: |
        [ -d "$GITHUB_WORKSPACE/files" ] && cp -rf "$GITHUB_WORKSPACE/files" "$GITHUB_WORKSPACE/openwrt/"
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 提取插件配置用于检测变更
      run: |
        cd openwrt
        grep -E '^(CONFIG_PACKAGE_|CONFIG_LUCI_|CONFIG_COLLECT_)' .config > ../current_pkg.txt

    - name: 判断是否执行完整编译
      id: judge_build
      run: |
        NEED_BUILD=0
        touch old_commit.txt

        #检测上游源码更新
        if [ -f ${{ env.CONFIG_CACHE_REF }} ] && [ -f ${{ env.UPSTREAM_COMMIT_FILE }} ] && [ -f old_commit.txt ]; then
          if ! diff -q ${{ env.UPSTREAM_COMMIT_FILE }} old_commit.txt; then
            echo "⚠️ 上游源码更新，强制编译"
            NEED_BUILD=1
          fi
        fi

        #对比插件配置，输出变更清单
        if [ $NEED_BUILD -eq 0 ] && [ -f ${{ env.CONFIG_CACHE_REF }} ]; then
          if diff -q current_pkg.txt ${{ env.CONFIG_CACHE_REF }}; then
            echo "✅ 插件配置无变更，停止编译"
          else
            echo "⚠️ 插件配置变更清单："
            diff -u ${{ env.CONFIG_CACHE_REF }} current_pkg.txt | grep -E '^[+-]' | grep -v '^[+-][+-]'
            NEED_BUILD=1
          fi
        elif [ $NEED_BUILD -eq 0 ]; then
          echo "ℹ️ 首次运行无缓存，执行编译"
          NEED_BUILD=1
        fi

        #更新上游commit记录
        cp ${{ env.UPSTREAM_COMMIT_FILE }} old_commit.txt || true

        #仅编译成功时更新插件缓存文件
        if [ "$NEED_BUILD" = "1" ]; then
          UPDATE_PKG=1
        else
          UPDATE_PKG=0
        fi
        echo "UPDATE_PKG=$UPDATE_PKG" >> $GITHUB_ENV
        echo "NEED_BUILD=$NEED_BUILD" >> $GITHUB_ENV

    - name: Download package
      id: package
      if: env.NEED_BUILD == '1'
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      if: env.NEED_BUILD == '1'
      run: |
        cd openwrt
        echo "===== 单线程编译工具链&内核，压低内存峰值 ====="
        nice -n 10 make -j1 tools/compile toolchain/compile target/compile
        echo "===== 多线程编译软件包 ====="
        nice -n 10 make -j$(nproc) package/compile || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    - name: 更新配置对比缓存
      if: env.UPDATE_PKG == '1'
      run: cp current_pkg.txt ${{ env.CONFIG_CACHE_REF }}

    - name: Check space usage
      if: (!cancelled() && env.NEED_BUILD == '1')
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' && env.NEED_BUILD == '1'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled() && env.NEED_BUILD == '1'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled() && env.NEED_BUILD == '1'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled() && env.NEED_BUILD == '1'
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled() && env.NEED_BUILD == '1'
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.NEED_BUILD == '1'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled() && env.NEED_BUILD == '1'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: ophub/delete-releases-workflows@main
      with:
        delete_releases: false
        delete_workflows: true
        workflows_keep_day: 7
        gh_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove old Releases
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.NEED_BUILD == '1'
      with:
        delete_releases: true
        releases_keep_latest: 5
        delete_tags: true
        gh_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up swap
      if: always()
      run: |
        cd "$GITHUB_WORKSPACE"
        sudo swapoff swapfile || true
        sudo rm -f swapfile
